services:
  postgres:
    image: postgres:18-alpine
    container_name: kumon_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ../pgdata:/var/lib/postgresql
      - ../sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  pgadmin:
    image: dpage/pgadmin4
    container_name: kumon_pgadmin
    restart: always
    env_file:
      - .env
    ports:
      - "5050:80"
    depends_on:
      - postgres